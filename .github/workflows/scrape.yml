name: Daily Ingestion Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write         # Allows the workflow to commit and push changes back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Pip Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium

      - name: Run Scraper Pipeline
        run: |
          python cli/main.py scrape
        env:
          CONFIG_PATH: config.yaml
          SQLITE_PATH: pikanews.db
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pikanews.db storage/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Daily news ingestion sync [skip ci]" && git push)
