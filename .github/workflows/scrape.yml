name: Daily Ingestion Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

# The scraper no longer commits to the repository. pikanews.db (~88 MB) and
# storage/ were previously committed daily, bloating git history. The public
# static site does not read the database; it is served from news_json/*.json.
# The database is now uploaded as a workflow artifact instead (retained 30
# days). Historical database content already committed to git history is NOT
# deleted. Merging this change is a user decision, flagged in the PR.
permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'

      - name: Cache Pip Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium

      - name: Run Scraper Pipeline
        run: |
          python cli/main.py scrape
        env:
          CONFIG_PATH: config.yaml
          SQLITE_PATH: pikanews.db
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

      - name: Upload database and storage as artifacts (30-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pikanews-db-daily
          path: |
            pikanews.db
            storage/
          retention-days: 30
          if-no-files-found: warn


