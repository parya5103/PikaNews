name: PikaNews Automatic News Collector

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full refresh (ignore cache)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect_news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for proper commits
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 python-dateutil
          
      - name: Create directories
        run: |
          mkdir -p .github/workflows/locks
          mkdir -p frontend/data
          
      - name: Check for existing lock
        id: check_lock
        run: |
          LOCK_FILE=".github/workflows/locks/news_collector.lock"
          if [ -f "$LOCK_FILE" ]; then
            # Check if lock is older than 1 hour (3600 seconds)
            FILE_AGE=$(( $(date +%s) - $(stat -c %Y "$LOCK_FILE") ))
            if [ $FILE_AGE -lt 3600 ]; then
              echo "Lock file exists and is recent, skipping..."
              echo "locked=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Lock file is old, removing it..."
              rm -f "$LOCK_FILE"
            fi
          fi
          echo "locked=false" >> $GITHUB_OUTPUT
          
      - name: Create lock file
        if: steps.check_lock.outputs.locked == 'false'
        run: |
          LOCK_FILE=".github/workflows/locks/news_collector.lock"
          mkdir -p .github/workflows/locks
          echo "Locked by $GITHUB_RUN_ID at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$LOCK_FILE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOCK_FILE"
          git commit -m "lock: News collector lock [skip ci]" || true
          git push || true
          
      - name: Run news collector
        if: steps.check_lock.outputs.locked == 'false'
        run: |
          python scripts/fetch_news.py
          
      - name: Generate sitemap
        if: steps.check_lock.outputs.locked == 'false'
        run: |
          python scripts/generate_sitemap.py
          
      - name: Generate RSS feed
        if: steps.check_lock.outputs.locked == 'false'
        run: |
          python scripts/generate_rss.py
          
      - name: Check for changes
        if: steps.check_lock.outputs.locked == 'false'
        id: check_changes
        run: |
          git add data/ news_json/ frontend/sitemap.xml frontend/feed.xml
          CHANGES=$(git status --porcelain | wc -l)
          if [ "$CHANGES" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_lock.outputs.locked == 'false' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "news: Automatic news collection update [skip ci]"
          git push
          
      - name: Remove lock file
        if: steps.check_lock.outputs.locked == 'false'
        run: |
          LOCK_FILE=".github/workflows/locks/news_collector.lock"
          rm -f "$LOCK_FILE"
          git add "$LOCK_FILE" || true
          git commit -m "lock: Remove news collector lock [skip ci]" --allow-empty || true
          git push || true
          
  deploy_pages:
    needs: collect_news
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vibe/pikanews-complete-9100d4'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Build static site
        run: |
          # Copy news JSON files to public directory
          mkdir -p public/data
          cp -r news_json/* public/data/ 2>/dev/null || true
          cp -r data/stats.json public/data/ 2>/dev/null || true
          
          # Copy frontend files
          cp -r frontend/* public/ 2>/dev/null || true
          
          # Ensure public directory has all necessary files
          ls -la public/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
