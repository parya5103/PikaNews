name: PikaNews Automatic News Collector

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# GitHub Actions native concurrency replaces the old lock-file design:
# overlapping runs are queued instead of racing, with no lock commits.
concurrency:
  group: news-collector
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-collector.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-collector.txt python-dateutil pytest

      - name: Run collector test suite (gate - fail before publishing)
        run: |
          set +e
          pytest tests/test_news_collector.py tests/test_news_expiry.py tests/test_generators.py tests/test_production_build.py tests/test_api_security.py -q > pytest_output.txt 2>&1
          status=$?
          cat pytest_output.txt
          if [ $status -ne 0 ]; then
            tail -20 pytest_output.txt | tr -cd '\40-\176\n' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::PYTEST: $line"
            done
            exit 1
          fi
          set -e

      - name: Collect news from RSS feeds (retry + dedupe; feed failures keep existing data)
        run: python scripts/fetch_news.py

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Generate static article pages
        run: python scripts/generate_article_pages.py

      - name: Generate Google News sitemap
        run: python scripts/generate_news_sitemap.py

      - name: Commit only when generated content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_json/ data/ frontend/news/ frontend/sitemap.xml frontend/news-sitemap.xml frontend/feed.xml
          if git diff --cached --quiet; then
            echo "No new content - no commit created."
          else
            git commit -m "news: automatic collection update [skip ci]"
            git pull --rebase origin main
            git push
          fi

# Deployment note:
# This workflow intentionally has NO Pages deploy job. PikaNews is published
# from the GoGo Company central repository (gogo-website) by
# .github/workflows/sync-pikanews.yml, which checks out PikaNews@main AFTER
# this collector has pushed, so the published site can never contain stale
# JSON, stats, sitemap or RSS data. Keeping a second deployment here would
# duplicate publishing and reintroduce the stale-checkout race it fixes.


