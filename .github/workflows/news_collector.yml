name: PikaNews Automatic News Collector

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # Rebuild generated article HTML immediately after indexation/generator policy
  # changes are merged; generated-content commits do not match these paths.
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - 'scripts/feed_engine.py'
      - 'tests/test_feed_engine.py'
      - 'scripts/classification_rules.py'
      - 'tests/test_guest_preferences.py'
      - 'frontend/css/styles.css'
      - 'frontend/science.html'
      - 'frontend/world.html'
      - 'frontend/latest.html'
      - 'frontend/js/utils.js'
      - 'frontend/js/app.js'
      - 'frontend/index.html'
      - 'frontend/js/preferences.js'
      - 'tests/test_classification_rules.py'
      - 'scripts/generate_article_pages.py'
      - 'scripts/validate_generated_articles.py'
      - 'scripts/generate_sitemap.py'
      - 'scripts/generate_news_sitemap.py'
      - 'scripts/generate_rss.py'
      - 'tests/test_generators.py'
      - 'tests/test_editorial_indexation.py'
      - 'tests/test_generated_article_validation.py'
      - 'tests/test_empty_master_feed_recovery.py'
      - '.github/workflows/news_collector.yml'

permissions:
  contents: write

# GitHub Actions native concurrency replaces the old lock-file design:
# overlapping runs are queued instead of racing, with no lock commits.
concurrency:
  group: news-collector
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-collector.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-collector.txt python-dateutil pytest

      - name: Run collector test suite (gate - fail before publishing)
        run: |
          set +e
          pytest tests/test_guest_preferences.py tests/test_classification_rules.py tests/test_news_collector.py tests/test_news_expiry.py tests/test_generators.py tests/test_production_build.py tests/test_api_security.py tests/test_editorial_indexation.py tests/test_generated_article_validation.py tests/test_empty_master_feed_recovery.py tests/test_topic_hub_indexation.py tests/test_feed_engine.py -q > pytest_output.txt 2>&1
          status=$?
          cat pytest_output.txt
          if [ $status -ne 0 ]; then
            tail -20 pytest_output.txt | tr -cd '\40-\176\n' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::PYTEST: $line"
            done
            exit 1
          fi
          set -e

      - name: Restore conditional feed response cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.4
        with:
          path: data/feed_cache
          key: pikanews-feed-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pikanews-feed-cache-

      - name: Collect news from RSS feeds (conditional fetch + dedupe; failures keep existing data)
        run: python scripts/fetch_news.py

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Generate static article pages
        run: python scripts/generate_article_pages.py

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Generate Google News sitemap
        run: python scripts/generate_news_sitemap.py

      - name: Validate generated article indexation, schema and breadcrumbs
        run: python scripts/validate_generated_articles.py

      - name: Commit only when generated content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_json/ data/ frontend/news/ frontend/sitemap.xml frontend/news-sitemap.xml frontend/feed.xml frontend/bollywood.html frontend/hollywood.html frontend/entertainment.html frontend/technology.html frontend/gaming.html frontend/business.html frontend/sports.html frontend/world.html frontend/science.html frontend/latest.html
          if git diff --cached --quiet; then
            echo "No new content - no commit created."
          else
            git commit -m "news: automatic collection update [skip ci]"
            git pull --rebase origin main
            git push
          fi

# Deployment note:
# This workflow intentionally has NO Pages deploy job. PikaNews is published
# from the GoGo Company central repository (gogo-website) by
# .github/workflows/sync-pikanews.yml, which checks out PikaNews@main AFTER
# this collector has pushed, so the published site can never contain stale
# JSON, stats, sitemap or RSS data. Keeping a second deployment here would
# duplicate publishing and reintroduce the stale-checkout race it fixes.


