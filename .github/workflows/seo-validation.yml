name: PikaNews SEO validation

on:
  pull_request:
    paths:
      - 'frontend/index.html'
      - 'tests/test_generators.py'
      - '.github/workflows/seo-validation.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/index.html'
      - 'tests/test_generators.py'
      - '.github/workflows/seo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run homepage SEO regression test
        run: python -m pytest tests/test_generators.py::test_homepage_has_clear_source_context_and_no_meta_keywords -q
