name: PikaNews News Admin

# Manual news management actions (unpublish / restore / permanent delete).
# Runs only via workflow_dispatch from the GitHub Actions tab, which requires
# write access to the repository - this is the admin gate. Every action
# requires a reason and is written to the audit log (data/admin_audit.md).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Admin action'
        required: true
        type: choice
        options:
          - unpublish
          - restore
          - delete
      article_ids:
        description: 'Article IDs (comma or space separated hashes)'
        required: true
        type: string
      reason:
        description: 'Mandatory reason (copyright / privacy / correction / spam / other)'
        required: true
        type: string

permissions:
  contents: write

# One admin action at a time; also serialized against the collector so a
# removal can never race the 30-minute collection push.
concurrency:
  group: news-collector
  cancel-in-progress: false

jobs:
  admin-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-collector.txt python-dateutil

      - name: Run admin action
        # Inputs are passed through env vars, never interpolated directly
        # into the shell command (script-injection hardening).
        env:
          ADMIN_ACTION: ${{ inputs.action }}
          ARTICLE_IDS: ${{ inputs.article_ids }}
          ADMIN_REASON: ${{ inputs.reason }}
        run: |
          python scripts/admin_actions.py \
            --action "$ADMIN_ACTION" \
            --article-ids "$ARTICLE_IDS" \
            --reason "$ADMIN_REASON"

      - name: Commit updated content and audit log
        env:
          ADMIN_ACTION: ${{ inputs.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ news_json/ frontend/news/ frontend/sitemap.xml frontend/news-sitemap.xml frontend/feed.xml
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit created."
          else
            git commit -m "admin: $ADMIN_ACTION via news-admin workflow [skip ci]"
            git pull --rebase origin main
            git push
          fi


